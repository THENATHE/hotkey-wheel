plugins { id 'net.fabricmc.fabric-loom' version '1.17.20' }

version = project.mod_version
group = 'com.thenathe'
base { archivesName = 'hotkey-wheel' }

repositories {
    mavenCentral()
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.3'
    if (project.hasProperty('modMenuJar')) {
        compileOnly files(project.property('modMenuJar'))
    } else {
        compileOnly 'com.terraformersmc:modmenu:21.0.0'
    }
    if (project.hasProperty('buildprintJar')) {
        compileOnly files(project.property('buildprintJar'))
    } else {
        compileOnly 'maven.modrinth:buildprint:0.1.17+26.x'
    }
    if (project.hasProperty('toolPouchJar')) {
        compileOnly files(project.property('toolPouchJar'))
    } else {
        compileOnly 'maven.modrinth:tool-pouch:1.1.10+26.3'
    }
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
jar { from('LICENSE') }
test { failOnNoDiscoveredTests = false }
